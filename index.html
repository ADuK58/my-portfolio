<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Lab | Artificial Intelligence Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #07080d; color: #cbd5e1; overflow-x: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="canvas-container"></div>

    <header class="sticky top-0 z-50 border-b border-white/10 glass">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="text-2xl font-syne font-extrabold text-white tracking-wider">NEURAL<span class="text-cyan-400">LAB</span></div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                <a href="#" class="hover:text-cyan-400 transition">About</a>
                <a href="#" class="hover:text-cyan-400 transition">Solutions</a>
                <a href="#" class="hover:text-cyan-400 transition">Process</a>
                <a href="#" class="hover:text-cyan-400 transition">Contact</a>
            </nav>
            <button class="px-5 py-2 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg text-sm transition">Launch AI</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-24">
        <div class="glass p-12 rounded-3xl max-w-2xl border border-cyan-900/30">
            <h1 class="text-5xl font-syne font-bold text-white mb-6">Autonomous <br><span class="text-cyan-400">Neural Systems</span></h1>
            <p class="text-slate-400 mb-8 leading-relaxed">Deploying high-performance neural networks and automation systems. We architect the future of intelligent infrastructure.</p>
            <button class="px-8 py-4 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-xl transition">Initialize Nodes</button>
        </div>
    </main>

    <script>
        let scene, camera, renderer, particles;
        const container = document.getElementById('canvas-container');

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 1500; i++) {
                vertices.push(Math.random() * 2000 - 1000, Math.random() * 2000 - 1000, Math.random() * 2000 - 1000);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0x06b6d4, size: 2, transparent: true, opacity: 0.5 });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            camera.position.z = 500;
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        animate();
    </script>
</body>
</html>
